[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "cyclic-import",                     # intentional parsing <-> parsefuncs cycle
    "duplicate-code",                    # kdl1 fast-path loops intentionally duplicate logic
    "fixme",
    "import-outside-toplevel",           # lazy kdl1 import
    "invalid-name",                      # camelCase style
    "line-too-long",                     # black handles line lengths
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-else-break",                     # stylistic preference
    "no-else-continue",                  # ditto
    "no-else-raise",                     # ditto
    "no-else-return",                    # ditto
    "redefined-builtin",
    "superfluous-parens",                # stylistic preference
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-return-statements",
    "too-many-statements",
    "useless-import-alias",              # explicit PEP 484 re-exports in __init__.py
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = [
    "E501",                              # black handles line lengths
    "F811",                              # @overload redefinitions
    "N802",                              # camelCase style
    "N803",
    "N806",
    "N812",
    "N815",
    "N816",
    "N999",
    "ANN401",                            # Any is used intentionally for untyped KDL values
    "S101",                              # assert is used for mypy narrowing
    "PLC0414",                           # explicit PEP 484 re-exports in __init__.py
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLR5501",
    "ISC003",                            # prefer explicit `+` over implicit multiline concat
    "SIM102",                            # stylistic readability preferences
    "SIM103",
    "SIM108",
    "SIM114",
]
select = [
    "ANN",
    "E",
    "F",
    "N",
    "W",
    "I",
    "YTT",
    "S",
    "PL",
    "COM",
    "C4",
    "EM",
    "EXE",
    "INP",
    "T20",
    "RSE",
    "ISC",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"check_perf.py" = ["T201"]               # CLI performance checker prints reports
"profiler.py" = ["T201"]                 # CLI profiler prints reports
"release.py" = ["S603", "S607", "T201"]  # release script prints progress and invokes git/build/twine
"test_*.py" = ["T201"]                   # test runners print results

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.check-manifest]
ignore = [
    "CONTRIBUTING.md",
    "check_perf.py",
    "lint",
    "mypy.ini",
    "profile",
    "profiler.py",
    "release.py",
    "requirements-dev.txt",
    "requirements.txt",
    "test_kdl1.py",
    "test_upstream.py",
    "upstream_tests/**",
    "upstream_tests_v1/**",
]
